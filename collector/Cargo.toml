[package]
name = "processpilot-collector"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Unprivileged, privacy-safe macOS telemetry collector for ProcessPilot"
license = "MIT"
repository = "https://github.com/mateoosoriodelhonte/processpilot"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
